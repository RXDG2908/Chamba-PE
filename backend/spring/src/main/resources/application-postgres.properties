# Perfil para la base PostgreSQL compartida con Django.
# Uso: SPRING_PROFILES_ACTIVE=postgres, con DATABASE_URL (jdbc:postgresql://...),
# DATABASE_USER y DATABASE_PASSWORD como variables de entorno. Nunca se versionan.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.read-only=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Spring nunca crea ni cambia tablas.
spring.jpa.hibernate.ddl-auto=none
# Pasar a validate cuando se pruebe contra la base PostgreSQL real (tipos smallint e integer de Django).
