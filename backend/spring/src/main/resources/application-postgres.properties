# Perfil para la base PostgreSQL compartida con Django.
# Uso: SPRING_PROFILES_ACTIVE=postgres, con SPRING_DATASOURCE_URL (jdbc:postgresql://host:5432/base),
# SPRING_DATASOURCE_USERNAME y SPRING_DATASOURCE_PASSWORD como variables de entorno. Nunca se versionan.
# Spring las lee solas; sin ellas el arranque falla en vez de abrir el SQLite por error.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.hikari.read-only=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Spring nunca crea ni cambia tablas.
spring.jpa.hibernate.ddl-auto=none
# Pasar a validate cuando se pruebe contra la base PostgreSQL real (tipos smallint e integer de Django).
