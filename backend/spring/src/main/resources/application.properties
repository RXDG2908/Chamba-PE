# Back End de usuario de ChambaPE.
spring.application.name=chambape-usuario
server.port=${PORT:8080}

# Base de datos: por defecto la misma db.sqlite3 de Django. La ruta es relativa a la carpeta desde
# donde se arranca (backend/spring/); al iniciar se registra la ruta completa.
# Otra base: variable SPRING_DATASOURCE_URL en formato JDBC (jdbc:sqlite:... o jdbc:postgresql://...),
# no DATABASE_URL: los hostings la llenan con postgres://usuario:clave@..., que JDBC no entiende.
# Spring escribe filas (solicitudes, su historial y la disponibilidad), nunca tablas: las crea Django.
# busy_timeout: si Django está escribiendo, SQLite espera hasta 5 s en vez de fallar al instante.
spring.datasource.url=jdbc:sqlite:../django/db.sqlite3?busy_timeout=5000
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Django es el dueño de las tablas: Spring nunca las crea ni las cambia.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Tomcat rechaza con 400 caracteres como | { } [ ] en la consulta; Django los acepta.
server.tomcat.relaxed-query-chars=",<,>,[,],^,`,{,|,}
# La línea de la petición puede medir hasta 64 KB, como en el runserver de Django (Tomcat trae 8 KB).
# Más allá Tomcat responde 400 con su propia página, antes de llegar a Spring.
server.max-http-request-header-size=64KB

# Inicio de sesión de la app: token de Firebase del mismo proyecto que usa Django.
chambape.firebase.proyecto=${FIREBASE_AUTH_PROJECT_ID:}
# Claves públicas con las que se firman los tokens; solo se cambia para pruebas locales.
chambape.firebase.claves=${FIREBASE_CLAVES_URL:https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com}
# Código de seguimiento de solicitudes sin cuenta: se firma con la misma clave que Django.
# Sin ella Spring no entrega ni acepta códigos (las solicitudes se siguen con la cuenta).
chambape.django.secret-key=${DJANGO_SECRET_KEY:}
# Como Django: con DJANGO_DEBUG=true y sin DJANGO_SECRET_KEY se usa la clave de desarrollo local.
chambape.django.debug=${DJANGO_DEBUG:false}
# La web de usuario también entra con la sesión de Django (cookie sessionid, firmada con esa clave).
# En POST y PATCH con sesión se exige el CSRF, aceptando estos orígenes como CSRF_TRUSTED_ORIGINS de Django.
chambape.django.csrf-origenes=${CSRF_TRUSTED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
# Notificaciones push al prestador (HU-8), con la cuenta de servicio de GOOGLE_APPLICATION_CREDENTIALS.
chambape.fcm.habilitado=${FCM_ENABLED:false}
chambape.fcm.proyecto=${FIREBASE_PROJECT_ID:}
