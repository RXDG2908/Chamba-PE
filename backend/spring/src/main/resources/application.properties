# Back End de usuario de ChambaPE.
spring.application.name=chambape-usuario
server.port=${PORT:8080}

# Base de datos: por defecto la misma db.sqlite3 de Django, en solo lectura.
# Se ejecuta desde backend/spring/; con otra ruta, define DATABASE_URL.
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:../django/db.sqlite3?open_mode=1}
# open_mode=1 abre SQLite en solo lectura; el pool debe saberlo o el driver rechaza la conexión.
# Si cambias DATABASE_URL a otro SQLite, mantén ?open_mode=1.
spring.datasource.hikari.read-only=true
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Django es el dueño de las tablas: Spring nunca las crea ni las cambia.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never
